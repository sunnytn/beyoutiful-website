services:
  db:
    image: postgres:16-alpine
    container_name: beyoutiful-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beyoutiful
      POSTGRES_PASSWORD: beyoutiful_dev_password
      POSTGRES_DB: beyoutiful
    ports:
      - "5432:5432"
    volumes:
      - beyoutiful_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beyoutiful"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beyoutiful_pgdata:
